name: Support dependency lock refresh
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Apply targeted patched versions
        working-directory: frontend
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          manifest.dependencies.vue = '3.5.42'
          manifest.pnpm.overrides['source-map-js'] = '1.2.2'
          writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
          pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: support-patched-lock
          path: |
            frontend/package.json
            frontend/pnpm-lock.yaml
          retention-days: 1
