name: Support dependency lock

on:
  push:
    branches: [feature/support-sessions-ui-20261007]
    paths:
      - frontend/package.json
      - .github/workflows/support-dependency-lock.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Generate dependency lock without executing package scripts
        working-directory: frontend
        run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: support-dependency-lock
          path: frontend/pnpm-lock.yaml
          retention-days: 7
