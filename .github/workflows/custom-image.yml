name: Custom Docker Image
run-name: Build ${{ inputs.image_tag }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to build, for example custom/subscription-quota-window'
        required: true
        default: 'custom/subscription-quota-window'
        type: string
      image_tag:
        description: 'Docker image tag to publish, for example 0.1.169-tc1.23.4-rc.1'
        required: true
        type: string
      app_version:
        description: 'Application version shown in UI and update checks, for example 0.1.169'
        required: true
        type: string
      push_latest_custom:
        description: 'Also publish latest-custom tag'
        required: false
        default: true
        type: boolean

concurrency:
  group: custom-image-${{ inputs.source_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sub2api-tocreate

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        shell: bash
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          PUSH_LATEST_CUSTOM: ${{ inputs.push_latest_custom }}
        run: |
          APP_VERSION="$INPUT_APP_VERSION"
          APP_VERSION="${APP_VERSION#v}"
          IMAGE_TAG="$INPUT_IMAGE_TAG"
          COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(git show -s --format=%cI "$COMMIT")"

          [ -n "$APP_VERSION" ] || { echo "app_version must not be empty" >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] \
            || { echo "invalid Docker image tag: $IMAGE_TAG" >&2; exit 1; }

          TAGS="${{ steps.image.outputs.name }}:${IMAGE_TAG},${{ steps.image.outputs.name }}:${COMMIT}"
          if [ "$PUSH_LATEST_CUSTOM" = 'true' ]; then
            TAGS="$TAGS,${{ steps.image.outputs.name }}:latest-custom"
          fi

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
