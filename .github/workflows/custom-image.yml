name: Custom Docker Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to build, for example custom/subscription-quota-window'
        required: true
        default: 'custom/subscription-quota-window'
        type: string
      image_tag:
        description: 'Docker image tag to publish, for example 0.1.139-subscription-quota.1'
        required: true
        default: '0.1.139-subscription-quota.1'
        type: string
      push_latest_custom:
        description: 'Also publish latest-custom tag'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sub2api-tocreate

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source_ref }}

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          VERSION='${{ github.event.inputs.image_tag }}'
          VERSION="${VERSION#v}"
          TAGS="${{ steps.image.outputs.name }}:${{ github.event.inputs.image_tag }}"
          if [ '${{ github.event.inputs.push_latest_custom }}' = 'true' ]; then
            TAGS="$TAGS,${{ steps.image.outputs.name }}:latest-custom"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
