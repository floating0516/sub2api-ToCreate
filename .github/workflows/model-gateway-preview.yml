name: Model Gateway Preview
on:
  push:
    branches: ['feature/model-gateway-demo-20261009']
    paths: ['frontend/**', '.github/workflows/model-gateway-preview.yml']
permissions:
  contents: read
concurrency:
  group: model-gateway-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint preview src/components/home/ModelGatewayDemo.vue src/components/home/modelGatewayMotion.ts src/components/home/__tests__/modelGatewayMotion.spec.ts --ext .vue,.ts
      - run: pnpm exec vue-tsc --noEmit -p tsconfig.preview.json
      - run: pnpm exec vitest run src/components/home/__tests__/modelGatewayMotion.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts
      - run: pnpm exec vite build --config vite.preview.config.ts
      - name: Browser verification and complete interaction recordings
        run: |
          npm install --prefix /tmp/tocreate-preview-tools playwright@1.58.2
          /tmp/tocreate-preview-tools/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 18084 --bind 127.0.0.1 --directory preview-dist > /tmp/tocreate-preview-http.log 2>&1 &
          node preview/verify-record.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-gateway-evidence
          path: frontend/preview-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: model-gateway-preview
          path: frontend/preview-dist
          retention-days: 14
